name: Import Hub Politico Data

on:
  push:
    branches:
      - data/hub-politico-runner
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: data/hub-politico-runner

      - name: Download audited package
        run: |
          curl --fail --location --retry 4 --retry-all-errors "https://hub-data-download-production.up.railway.app/bundle.gz" -o hub-politico-data.json.gz
          python - <<'PY'
          import gzip, json, pathlib
          out = pathlib.Path('data/generated')
          out.mkdir(parents=True, exist_ok=True)
          with gzip.open('hub-politico-data.json.gz', 'rt', encoding='utf-8') as fh:
              package = json.load(fh)
          for name, text in package['files'].items():
              (out / name).write_text(text, encoding='utf-8')
          print('files', len(package['files']))
          print('bytes', sum((out / name).stat().st_size for name in package['files']))
          PY

      - name: Audit critical files
        run: |
          test -s data/generated/auditoria.json
          test -s data/generated/mario_municipio_2026.csv
          test -s data/generated/pp_vereadores_selecionados_2024.csv
          test -s data/generated/deputados_federais_municipio_2026.csv
          test -s data/generated/mario_secao_cruzado_2026.csv
          python - <<'PY'
          import json
          a=json.load(open('data/generated/auditoria.json',encoding='utf-8'))
          print(json.dumps(a.get('quality_checks',{}),ensure_ascii=False,indent=2))
          failed=[k for k,v in a.get('quality_checks',{}).items() if not v]
          print('quality_warnings', failed)
          PY

      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'data: importa base auditada do Hub Político [skip ci]'
            git push origin HEAD:data/hub-politico-runner
          fi
